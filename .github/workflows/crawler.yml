name: Daily Tender Crawler

on:
  schedule:
    - cron: '0 0 * * *' # 台灣時間每天上午 08:00 自動執行
  workflow_dispatch:

jobs:
  run-crawler:
    runs-on: ubuntu-latest

    steps:
      - name: 檢出專案程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝 Python 套件與 Playwright 瀏覽器
        run: |
          python -m pip install --upgrade pip
          # 1. 在這裡加入了 google-generativeai 套件
          pip install playwright beautifulsoup4 gspread google-auth google-generativeai
          playwright install chromium
          playwright install-deps

      - name: 執行 Python 爬蟲並寫入 Google 試算表
        # 2. 在這裡將 Secrets 帶入為 Python 看得到的環境變數
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          SPREADSHEET_KEY: ${{ secrets.SPREADSHEET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python search.py
