name: Daily Tender Crawler

on:
  schedule:
    # 每天 UTC 00:00 (台灣時間上午 08:00) 自動執行
    - cron: '0 0 * * *'
  # 支援在 GitHub 網頁手動按鈕立即執行
  workflow_dispatch:

jobs:
  run-crawler:
    runs-on: ubuntu-latest

    steps:
      - name: 檢出專案程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝 Python 套件與 Playwright 瀏覽器
        run: |
          python -m pip install --upgrade pip
          pip install playwright beautifulsoup4
          playwright install chromium
          playwright install-deps

      - name: 執行 Python 爬蟲
        run: python search.py

      - name: 儲存抓取到的 CSV/JSON 檔案為 Artifacts (可供下載)
        uses: actions/upload-artifact@v4
        with:
          name: daily-tender-data
          path: |
            today_services_*.csv
            today_services_*.json
          retention-days: 7
