<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>帆船政府標案AI篩選系統</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
  <style>
    body { background-color: #f4f6f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
    .search-box { max-width: 400px; }
    .cursor-pointer { cursor: pointer; }
    .table-recommend { border-top: 3px solid #198754; }
    .sortable-th { cursor: pointer; user-select: none; }
    .sortable-th:hover { background-color: #e9ecef; }
    .filter-note-badge { font-size: 0.8rem; }
  </style>
</head>
<body>

  <div class="container py-4">
    <!-- 標題、日期與刷新按鈕 -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h2 class="fw-bold text-dark mb-1">🤖 帆船政府標案AI篩選系統</h2>
        <div class="d-flex align-items-center gap-2">
          <p class="text-muted small mb-0">每日自動爬取、預算過濾與 AI 智慧評分</p>
          <span class="badge bg-secondary-subtle text-secondary border border-secondary-subtle" id="data-date-badge">
            <i class="bi bi-calendar3"></i> 資料日期：讀取中...
          </span>
        </div>
      </div>
      <button class="btn btn-primary" onclick="fetchData()">
        <i class="bi bi-arrow-clockwise"></i> 刷新資料
      </button>
    </div>

    <!-- 載入中動畫 -->
    <div id="loading" class="text-center py-5">
      <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status"></div>
      <p class="mt-3 text-muted fw-bold">正在連線 Google Sheets 同步設定與標案...</p>
    </div>

    <div id="content-area" style="display: none;">
      
      <!-- 區塊一：★ 高分推薦標案（動態撈取系統設定） -->
      <div class="card shadow-sm border-0 mb-5">
        <div class="card-header bg-white py-3">
          <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-2">
            <div class="d-flex align-items-center gap-2">
              <h5 class="fw-bold text-success mb-0">
                <i class="bi bi-star-fill text-warning"></i> 高分推薦標案 (<span id="rec-count">0</span>)
              </h5>
              <span class="badge bg-success-subtle text-success border border-success-subtle">已依分數降冪排序</span>
            </div>
          </div>
          
          <!-- 動態篩選條件註記區 -->
          <div class="d-flex flex-wrap gap-2 align-items-center pt-2 border-top mt-2">
            <span class="text-muted small fw-bold"><i class="bi bi-funnel-fill text-primary"></i> 篩選條件：</span>
            <span class="badge bg-light text-dark border filter-note-badge" id="badge-budget">
              <i class="bi bi-currency-dollar text-danger"></i> 預算金額：載入中...
            </span>
            <span class="badge bg-light text-dark border filter-note-badge">
              <i class="bi bi-award-fill text-warning"></i> 推薦標準：AI 評分 ≥ 70分 或 ★手動標記
            </span>
            <span class="badge bg-light text-dark border filter-note-badge" id="badge-skills">
              <i class="bi bi-cpu-fill text-info"></i> 評分依據：載入中...
            </span>
          </div>
        </div>

        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0 table-recommend">
              <thead class="table-light">
                <tr>
                  <th class="sortable-th" style="width: 10%;" onclick="sortData('rec', 'scoreNum')">AI評分 <span id="sort-rec-scoreNum">▼</span></th>
                  <th class="sortable-th" style="width: 15%;" onclick="sortData('rec', 'orgStr')">招標機關 <span id="sort-rec-orgStr"></span></th>
                  <th class="sortable-th" style="width: 30%;" onclick="sortData('rec', 'titleStr')">標案名稱 <span id="sort-rec-titleStr"></span></th>
                  <th class="sortable-th" style="width: 13%;" onclick="sortData('rec', 'budgetNum')">預算金額 <span id="sort-rec-budgetNum"></span></th>
                  <th style="width: 24%;">AI 評分依據與評語</th>
                  <th style="width: 8%;">動作</th>
                </tr>
              </thead>
              <tbody id="recommended-table-body"></tbody>
            </table>
          </div>
        </div>
      </div>


      <!-- 區塊二：📋 剩餘標案清單 (預設金額降冪) -->
      <div class="card shadow-sm border-0 mb-4">
        <div class="card-header bg-white py-3">
          <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
            <div class="fw-bold fs-5 cursor-pointer text-dark select-none" onclick="toggleCollapse()">
              <i id="collapse-icon" class="bi bi-chevron-right me-1"></i> 剩餘標案清單 (<span id="other-count">0</span>)
              <span class="text-muted fs-6 fw-normal ms-2">(點擊展開/收合)</span>
            </div>
            
            <div class="search-box input-group input-group-sm">
              <span class="input-group-text bg-light"><i class="bi bi-search"></i></span>
              <input type="text" id="searchInput" class="form-control" placeholder="搜尋招標機關或標案名稱..." onkeyup="filterOtherTenders()">
            </div>
          </div>
        </div>

        <div id="otherTendersArea" style="display: none;">
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                  <tr>
                    <th class="sortable-th" style="width: 18%;" onclick="sortData('other', 'orgStr')">招標機關 <span id="sort-other-orgStr"></span></th>
                    <th class="sortable-th" style="width: 42%;" onclick="sortData('other', 'titleStr')">標案名稱 <span id="sort-other-titleStr"></span></th>
                    <th class="sortable-th" style="width: 15%;" onclick="sortData('other', 'budgetNum')">預算金額 <span id="sort-other-budgetNum">▼</span></th>
                    <th class="sortable-th" style="width: 10%;" onclick="sortData('other', 'scoreNum')">AI 評分 <span id="sort-other-scoreNum"></span></th>
                    <th style="width: 15%;">動作</th>
                  </tr>
                </thead>
                <tbody id="other-table-body"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    const SPREADSHEET_ID = '1Hc2KqH0ZWT1Ty-5RBa4zdsx-8RLrHG-tNE5qJHuaQ6U';
    const GID_CONFIG = '888640987';   // 系統設定分頁 GID
    const GID_TENDERS = '1698058908'; // 每日勞務標案分頁 GID

    let recommendedData = [];
    let otherData = [];
    let currentFilteredOtherData = [];

    let recSortState = { field: 'scoreNum', dir: 'desc' };
    let otherSortState = { field: 'budgetNum', dir: 'desc' };

    function toggleCollapse() {
      const area = document.getElementById('otherTendersArea');
      const icon = document.getElementById('collapse-icon');
      if (area.style.display === 'none') {
        area.style.display = 'block';
        icon.className = 'bi bi-chevron-down me-1';
      } else {
        area.style.display = 'none';
        icon.className = 'bi bi-chevron-right me-1';
      }
    }

    // 第一步：精準使用 GID 撈取「系統設定」分頁
    function fetchData() {
      document.getElementById('loading').style.display = 'block';
      document.getElementById('content-area').style.display = 'none';

      const oldConfigScript = document.getElementById('gviz-config-script');
      if (oldConfigScript) oldConfigScript.remove();

      const configScript = document.createElement('script');
      configScript.id = 'gviz-config-script';
      configScript.src = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?gid=${GID_CONFIG}&tqx=responseHandler:handleConfigData`;
      
      configScript.onerror = function() {
        console.warn('讀取系統設定分頁失敗，準備直接讀取標案資料');
        fetchTendersData();
      };

      document.body.appendChild(configScript);
    }

    // 解析系統設定：
    // Row 1 (標題): rows[0]
    // Row 2 (B2 最低金額): rows[1]
    // Row 3 (B3 最高金額): rows[2]
    // Row 4 (B4 擅長條件): rows[3]
    function handleConfigData(response) {
      try {
        if (response && response.table && response.table.rows) {
          const rows = response.table.rows;
          
          let minBudgetStr = rows[1]?.c[1]?.v ?? rows[1]?.c[1]?.f ?? '';
          let maxBudgetStr = rows[2]?.c[1]?.v ?? rows[2]?.c[1]?.f ?? '';
          
          // 正確指向 Row 4 (B4 儲存格)
          let skillsStr = rows[3]?.c[1]?.v ?? rows[3]?.c[1]?.f ?? '';

          let minB = typeof minBudgetStr === 'number' ? minBudgetStr : parseInt(String(minBudgetStr).replace(/[^\d]/g, '')) || 0;
          let maxB = typeof maxBudgetStr === 'number' ? maxBudgetStr : parseInt(String(maxBudgetStr).replace(/[^\d]/g, '')) || 0;

          let budgetDisplay = '預算金額：';
          if (minB > 0 || maxB > 0) {
            budgetDisplay += `${formatCurrency(minB)} ~ ${maxB > 0 ? formatCurrency(maxB) : '無上限'}`;
          } else {
            budgetDisplay += '未限制';
          }
          
          document.getElementById('badge-budget').innerHTML = `<i class="bi bi-currency-dollar text-danger"></i> ${budgetDisplay}`;
          document.getElementById('badge-skills').innerHTML = `<i class="bi bi-cpu-fill text-info"></i> AI 評分依據 (公司擅長條件)：<strong>${skillsStr || '未設定'}</strong>`;
        }
      } catch (err) {
        console.error('解析系統設定時出錯:', err);
      } finally {
        fetchTendersData();
      }
    }

    function formatCurrency(num) {
      if (num >= 10000) {
        return (num / 10000) + '萬';
      }
      return num.toLocaleString() + '元';
    }

    // 第二步：精準使用 GID 撈取「每日勞務標案」分頁
    function fetchTendersData() {
      const oldScript = document.getElementById('gviz-script');
      if (oldScript) oldScript.remove();

      const script = document.createElement('script');
      script.id = 'gviz-script';
      script.src = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?gid=${GID_TENDERS}&tqx=responseHandler:handleGvizData`;
      
      script.onerror = function() {
        alert('標案資料載入失敗，請確認試算表權限！');
        document.getElementById('loading').style.display = 'none';
      };

      document.body.appendChild(script);
    }

    function handleGvizData(response) {
      try {
        if (response.status === 'error') throw new Error('GViz Error');

        const table = response.table;
        const cols = table.cols.map(col => (col ? String(col.label).trim() : ''));
        
        const rows = table.rows.map(row => {
          let item = {};
          if (row.c) {
            row.c.forEach((cell, idx) => {
              const colName = cols[idx];
              if (colName) item[colName] = cell ? (cell.v !== null && cell.v !== undefined ? cell.v : cell.f) : '';
            });
          }
          return item;
        });

        let detectedDate = '';

        rows.forEach(item => {
          let scoreVal = 0, budgetVal = 0;
          let titleVal = '', orgVal = '-', reasonVal = '無評語', linkVal = '#', recVal = '';

          for (let key in item) {
            const cleanKey = key.trim();
            const val = String(item[key]);

            if (!detectedDate && (cleanKey.includes('日期') || cleanKey.includes('時間') || val.match(/\d{2}-\d{2}/))) {
              detectedDate = val;
            }

            if (cleanKey.includes('評分') && !cleanKey.includes('理由')) scoreVal = parseInt(val.replace(/[^\d]/g, '')) || 0;
            if (cleanKey.includes('預算')) budgetVal = parseInt(val.replace(/[^\d]/g, '')) || 0;
            if (cleanKey.includes('標案名稱') || cleanKey.includes('名稱')) titleVal = item[key];
            if (cleanKey.includes('機關')) orgVal = item[key];
            if (cleanKey.includes('理由') || cleanKey.includes('評語')) reasonVal = item[key];
            if (cleanKey.includes('連結') || cleanKey.includes('網址')) linkVal = item[key];
            if (cleanKey.includes('推薦') || cleanKey.includes('標記')) recVal = item[key];
          }

          item.scoreNum = scoreVal;
          item.budgetNum = budgetVal;
          item.titleStr = titleVal || '未命名標案';
          item.orgStr = orgVal || '-';
          item.reasonStr = reasonVal || '無評語';
          item.linkStr = linkVal || '#';
          item.isRec = scoreVal >= 70 || String(recVal).includes('★');
        });

        formatAndShowDate(detectedDate);

        recommendedData = rows.filter(r => r.isRec);
        otherData = rows.filter(r => !r.isRec);

        // 預設排序套用
        applySorting('rec', recSortState.field, recSortState.dir);
        applySorting('other', otherSortState.field, otherSortState.dir);

        currentFilteredOtherData = [...otherData];

        renderRecommended();
        renderOthers(currentFilteredOtherData);

        document.getElementById('rec-count').innerText = recommendedData.length;
        document.getElementById('other-count').innerText = otherData.length;

        document.getElementById('loading').style.display = 'none';
        document.getElementById('content-area').style.display = 'block';

      } catch (error) {
        console.error('Data Error:', error);
        alert('資料解析失敗！');
        document.getElementById('loading').style.display = 'none';
      }
    }

    function sortData(type, field) {
      let state = (type === 'rec') ? recSortState : otherSortState;

      if (state.field === field) {
        state.dir = (state.dir === 'desc') ? 'asc' : 'desc';
      } else {
        state.field = field;
        state.dir = 'desc';
      }

      applySorting(type, state.field, state.dir);
      updateSortIcons(type, state.field, state.dir);

      if (type === 'rec') {
        renderRecommended();
      } else {
        filterOtherTenders();
      }
    }

    function applySorting(type, field, dir) {
      let targetList = (type === 'rec') ? recommendedData : otherData;

      targetList.sort((a, b) => {
        let valA = a[field];
        let valB = b[field];

        if (typeof valA === 'string') {
          return dir === 'asc' ? valA.localeCompare(valB, 'zh-Hant') : valB.localeCompare(valA, 'zh-Hant');
        } else {
          return dir === 'asc' ? valA - valB : valB - valA;
        }
      });
    }

    function updateSortIcons(type, activeField, dir) {
      const fields = (type === 'rec') 
        ? ['scoreNum', 'orgStr', 'titleStr', 'budgetNum'] 
        : ['orgStr', 'titleStr', 'budgetNum', 'scoreNum'];

      fields.forEach(f => {
        const el = document.getElementById(`sort-${type}-${f}`);
        if (el) {
          if (f === activeField) {
            el.innerText = dir === 'desc' ? '▼' : '▲';
          } else {
            el.innerText = '';
          }
        }
      });
    }

    function formatAndShowDate(rawDateStr) {
      const dateBadge = document.getElementById('data-date-badge');
      const today = new Date();
      const currentYear = today.getFullYear();
      let formattedDate = '';

      if (rawDateStr) {
        const match = String(rawDateStr).match(/(\d{4})?[-\/]?(\d{1,2})[-\/](\d{1,2})/);
        if (match) {
          const year = match[1] || currentYear;
          const month = String(match[2]).padStart(2, '0');
          const day = String(match[3]).padStart(2, '0');
          formattedDate = `${year}-${month}-${day}`;
        }
      }

      if (!formattedDate) {
        const m = String(today.getMonth() + 1).padStart(2, '0');
        const d = String(today.getDate()).padStart(2, '0');
        formattedDate = `${currentYear}-${m}-${d}`;
      }

      dateBadge.innerHTML = `<i class="bi bi-calendar3"></i> 資料日期：${formattedDate}`;
    }

    function renderRecommended() {
      const tbody = document.getElementById('recommended-table-body');
      tbody.innerHTML = '';

      if (recommendedData.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4">今日無符合條件的高分推薦標案。</td></tr>';
        return;
      }

      recommendedData.forEach(item => {
        const rowHtml = `
          <tr>
            <td><span class="badge bg-success fs-6 py-2 px-2">${item.scoreNum} 分</span></td>
            <td class="small fw-bold text-secondary">${item.orgStr}</td>
            <td class="fw-bold text-dark">${item.titleStr}</td>
            <td class="text-danger fw-bold">$${item.budgetNum.toLocaleString()}</td>
            <td class="small text-muted">${item.reasonStr}</td>
            <td>
              <a href="${item.linkStr}" target="_blank" class="btn btn-sm btn-outline-primary">
                連結 <i class="bi bi-box-arrow-up-right"></i>
              </a>
            </td>
          </tr>
        `;
        tbody.innerHTML += rowHtml;
      });
    }

    function renderOthers(dataList) {
      const tbody = document.getElementById('other-table-body');
      tbody.innerHTML = '';

      if (dataList.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-4">無符合條件的標案</td></tr>';
        return;
      }

      dataList.forEach(item => {
        const rowHtml = `
          <tr>
            <td class="small fw-bold text-secondary">${item.orgStr}</td>
            <td class="small fw-bold">${item.titleStr}</td>
            <td class="small text-danger fw-bold">$${item.budgetNum.toLocaleString()}</td>
            <td><span class="badge bg-secondary">${item.scoreNum} 分</span></td>
            <td>
              <a href="${item.linkStr}" target="_blank" class="btn btn-sm btn-light border text-primary">
                連結 <i class="bi bi-box-arrow-up-right"></i>
              </a>
            </td>
          </tr>
        `;
        tbody.innerHTML += rowHtml;
      });
    }

    function filterOtherTenders() {
      const keyword = document.getElementById('searchInput').value.toLowerCase().trim();
      currentFilteredOtherData = otherData.filter(item => {
        const matchTitle = item.titleStr.toLowerCase().includes(keyword);
        const matchOrg = item.orgStr.toLowerCase().includes(keyword);
        return matchTitle || matchOrg;
      });
      renderOthers(currentFilteredOtherData);
    }

    window.onload = fetchData;
  </script>
</body>
</html>
