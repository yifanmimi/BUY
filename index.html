<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>政府標案 AI 智能篩選系統</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
  <style>
    body { background-color: #f4f6f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
    .search-box { max-width: 400px; }
    .cursor-pointer { cursor: pointer; }
    .table-recommend { border-top: 3px solid #198754; }
  </style>
</head>
<body>

  <div class="container py-4">
    <!-- 標題與刷新按鈕 -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h2 class="fw-bold text-dark mb-1">🤖 政府標案 AI 智能篩選系統</h2>
        <p class="text-muted small mb-0">每日自動爬取、預算過濾與 AI 智慧評分</p>
      </div>
      <button class="btn btn-primary" onclick="fetchData()">
        <i class="bi bi-arrow-clockwise"></i> 刷新資料
      </button>
    </div>

    <!-- 載入中動畫 -->
    <div id="loading" class="text-center py-5">
      <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status"></div>
      <p class="mt-3 text-muted fw-bold">正在讀取最新標案資料...</p>
    </div>

    <div id="content-area" style="display: none;">
      
      <!-- 區塊一：★ 高分推薦標案 (表格欄位式 + 降冪排列) -->
      <div class="card shadow-sm border-0 mb-5">
        <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
          <h5 class="fw-bold text-success mb-0">
            <i class="bi bi-star-fill text-warning"></i> 高分推薦標案 (<span id="rec-count">0</span>)
          </h5>
          <span class="badge bg-success-subtle text-success border border-success-subtle">已依分數高到低排序</span>
        </div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0 table-recommend">
              <thead class="table-light">
                <tr>
                  <th style="width: 8%;">AI評分</th>
                  <th style="width: 15%;">招標機關</th>
                  <th style="width: 35%;">標案名稱</th>
                  <th style="width: 12%;">預算金額</th>
                  <th style="width: 22%;">AI 評語</th>
                  <th style="width: 8%;">動作</th>
                </tr>
              </thead>
              <tbody id="recommended-table-body"></tbody>
            </table>
          </div>
        </div>
      </div>


      <!-- 區塊二：📋 剩餘標案清單 (表格欄位式 + 預設收合 + 搜尋) -->
      <div class="card shadow-sm border-0 mb-4">
        <div class="card-header bg-white py-3">
          <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
            <div class="fw-bold fs-5 cursor-pointer text-dark select-none" onclick="toggleCollapse()">
              <i id="collapse-icon" class="bi bi-chevron-right me-1"></i> 剩餘標案清單 (<span id="other-count">0</span>)
              <span class="text-muted fs-6 fw-normal ms-2">(點擊展開/收合)</span>
            </div>
            
            <div class="search-box input-group input-group-sm">
              <span class="input-group-text bg-light"><i class="bi bi-search"></i></span>
              <input type="text" id="searchInput" class="form-control" placeholder="搜尋招標機關或標案名稱..." onkeyup="filterOtherTenders()">
            </div>
          </div>
        </div>

        <div id="otherTendersArea" style="display: none;">
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                  <tr>
                    <th style="width: 15%;">招標機關</th>
                    <th style="width: 45%;">標案名稱</th>
                    <th style="width: 15%;">預算金額</th>
                    <th style="width: 10%;">AI 評分</th>
                    <th style="width: 15%;">動作</th>
                  </tr>
                </thead>
                <tbody id="other-table-body"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    const SPREADSHEET_ID = '1Hc2KqH0ZWT1Ty-5RBa4zdsx-8RLrHG-tNE5qJHuaQ6U';
    const GID = '1698058908';

    let recommendedData = [];
    let otherData = [];

    function toggleCollapse() {
      const area = document.getElementById('otherTendersArea');
      const icon = document.getElementById('collapse-icon');
      if (area.style.display === 'none') {
        area.style.display = 'block';
        icon.className = 'bi bi-chevron-down me-1';
      } else {
        area.style.display = 'none';
        icon.className = 'bi bi-chevron-right me-1';
      }
    }

    function fetchData() {
      document.getElementById('loading').style.display = 'block';
      document.getElementById('content-area').style.display = 'none';

      const oldScript = document.getElementById('gviz-script');
      if (oldScript) oldScript.remove();

      const script = document.createElement('script');
      script.id = 'gviz-script';
      script.src = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?gid=${GID}&tqx=responseHandler:handleGvizData`;
      
      script.onerror = function() {
        alert('資料載入失敗，請確認試算表權限已開啟！');
        document.getElementById('loading').style.display = 'none';
      };

      document.body.appendChild(script);
    }

    function handleGvizData(response) {
      try {
        if (response.status === 'error') {
          throw new Error(response.errors[0].detailed_message || 'GViz Error');
        }

        const table = response.table;
        const cols = table.cols.map(col => (col ? String(col.label).trim() : ''));
        
        const rows = table.rows.map(row => {
          let item = {};
          if (row.c) {
            row.c.forEach((cell, idx) => {
              const colName = cols[idx];
              if (colName) {
                item[colName] = cell ? (cell.v !== null && cell.v !== undefined ? cell.v : cell.f) : '';
              }
            });
          }
          return item;
        });

        rows.forEach(item => {
          let scoreVal = 0;
          let budgetVal = 0;
          let titleVal = '';
          let orgVal = '-';
          let reasonVal = '無評語';
          let linkVal = '#';
          let recVal = '';

          for (let key in item) {
            const cleanKey = key.trim();
            const val = String(item[key]);

            if (cleanKey.includes('評分') && !cleanKey.includes('理由')) scoreVal = parseInt(val.replace(/[^\d]/g, '')) || 0;
            if (cleanKey.includes('預算')) budgetVal = parseInt(val.replace(/[^\d]/g, '')) || 0;
            if (cleanKey.includes('標案名稱') || cleanKey.includes('名稱')) titleVal = item[key];
            if (cleanKey.includes('機關')) orgVal = item[key];
            if (cleanKey.includes('理由') || cleanKey.includes('評語')) reasonVal = item[key];
            if (cleanKey.includes('連結') || cleanKey.includes('網址')) linkVal = item[key];
            if (cleanKey.includes('推薦') || cleanKey.includes('標記')) recVal = item[key];
          }

          item.scoreNum = scoreVal;
          item.budgetNum = budgetVal;
          item.titleStr = titleVal || '未命名標案';
          item.orgStr = orgVal || '-';
          item.reasonStr = reasonVal || '無評語';
          item.linkStr = linkVal || '#';
          item.isRec = scoreVal >= 70 || String(recVal).includes('★');
        });

        recommendedData = rows.filter(r => r.isRec);
        otherData = rows.filter(r => !r.isRec);

        recommendedData.sort((a, b) => b.scoreNum - a.scoreNum);

        renderRecommended();
        renderOthers(otherData);

        document.getElementById('rec-count').innerText = recommendedData.length;
        document.getElementById('other-count').innerText = otherData.length;

        document.getElementById('loading').style.display = 'none';
        document.getElementById('content-area').style.display = 'block';

      } catch (error) {
        console.error('Data Processing Error:', error);
        alert('資料解析失敗！');
        document.getElementById('loading').style.display = 'none';
      }
    }

    // 渲染高分推薦表格
    function renderRecommended() {
      const tbody = document.getElementById('recommended-table-body');
      tbody.innerHTML = '';

      if (recommendedData.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4">今日無符合條件的高分推薦標案。</td></tr>';
        return;
      }

      recommendedData.forEach(item => {
        const rowHtml = `
          <tr>
            <td><span class="badge bg-success fs-6 py-2 px-2">${item.scoreNum} 分</span></td>
            <td class="small fw-bold text-secondary">${item.orgStr}</td>
            <td class="fw-bold text-dark">${item.titleStr}</td>
            <td class="text-danger fw-bold">$${item.budgetNum.toLocaleString()}</td>
            <td class="small text-muted">💡 ${item.reasonStr}</td>
            <td>
              <a href="${item.linkStr}" target="_blank" class="btn btn-sm btn-outline-primary">
                連結 <i class="bi bi-box-arrow-up-right"></i>
              </a>
            </td>
          </tr>
        `;
        tbody.innerHTML += rowHtml;
      });
    }

    // 渲染剩餘標案表格
    function renderOthers(dataList) {
      const tbody = document.getElementById('other-table-body');
      tbody.innerHTML = '';

      if (dataList.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-4">無符合條件的標案</td></tr>';
        return;
      }

      dataList.forEach(item => {
        const rowHtml = `
          <tr>
            <td class="small fw-bold text-secondary">${item.orgStr}</td>
            <td class="small fw-bold">${item.titleStr}</td>
            <td class="small text-danger fw-bold">$${item.budgetNum.toLocaleString()}</td>
            <td><span class="badge bg-secondary">${item.scoreNum} 分</span></td>
            <td>
              <a href="${item.linkStr}" target="_blank" class="btn btn-sm btn-light border text-primary">
                連結 <i class="bi bi-box-arrow-up-right"></i>
              </a>
            </td>
          </tr>
        `;
        tbody.innerHTML += rowHtml;
      });
    }

    function filterOtherTenders() {
      const keyword = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = otherData.filter(item => {
        const matchTitle = item.titleStr.toLowerCase().includes(keyword);
        const matchOrg = item.orgStr.toLowerCase().includes(keyword);
        return matchTitle || matchOrg;
      });
      renderOthers(filtered);
    }

    window.onload = fetchData;
  </script>
</body>
</html>
